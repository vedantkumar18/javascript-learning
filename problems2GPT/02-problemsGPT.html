<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="02-problemsGPT.css">
    <title>Document</title>
</head>
<body>

    <!-- Dynamic welcome page -->
<p>dynamic welcome page</p>


<input class="username" placeholder="Name" type="text">
<button onclick="
dynamicUsername();
">send</button>
<br>
<p class="welcome-message"></p>

<hr>

<!-- Age checker -->
<p>age verification</p>


<input type="text" placeholder="age" class="input-age">
<button onclick="
ageChecker();
">age verification</button>
<p class="age-checker"></p>

<hr>

<!-- simple calculator (no events) -->
<p>simple caclulator</p>

<input class="num1" type="text" placeholder="number">
<input class="num2" type="text" placeholder="number">
<button onclick="
calculate();
">Calculate</button>
<p class="result"></p>

<hr>

<!-- number comparison -->

<p>NUmber comparison (taking the numbers from the simple calculator as reference.)</p>

<input class="comparisonNum1" type="text">
<input class="comparisonNum2" type="text">

<p class="num-comparison"></p>

<hr>
<!-- Mini product page -->

<p>Basketball</p>
<p>30rs</p>
<input class="quantity" type="text" placeholder="quantity">
<button onclick="
totalcost();
">cost</button>
<p class="total-value"> </p>

<hr>

<!-- mini quiz -->

<p>how many hours a day does a coder code for?</p>
<button onclick="quizAnswer(1);" class="option1">1</button>
<button onclick="quizAnswer(4);" class="option2">4</button>
<button onclick="quizAnswer(6);" class="option3">6</button>
<button onclick="quizAnswer(8);" class="option4">8</button>

<p class="answer"></p>

<hr>

<!-- mini shopping cart -->

<p>cap</p>
<p>10rs</p>
<input class="product1-quantity">
<p class="product1-price"></p>


<p>ball</p>
<p>20rs</p>
<input class="product2-quantity">
<p class="product2-price"></p>

<p>lolipops</p>
<p>30rs</p>
<input class="product3-quantity">
<p class="product3-price"></p>

<p class="grand-Total"></p>





























    <script src="02-problemsGPT.js"></script>
</body>
</html>
